<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Toast</title><link rel="stylesheet" href="/style.css"></head>
<body>
<h1>Settings</h1>
<button type="button" id="save">Save</button>
<script type="module">
  document.getElementById('save').addEventListener('click', () => {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = 'Saved with errors';
    document.body.append(t);
    setTimeout(() => t.remove(), 1500);
  });
</script>
</body></html>
